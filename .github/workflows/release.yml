name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Compile Java sources
        run: |
          mkdir -p build/classes
          find src -name "*.java" \
            -not -path "*/NotInUse/*" \
            > sources.txt
          javac \
            -cp "libs/json-20230618.jar:libs/jsoup-1.17.2.jar" \
            -d build/classes \
            @sources.txt

      - name: Extract library JARs
        run: |
          cd build/classes
          jar xf ../../libs/json-20230618.jar
          jar xf ../../libs/jsoup-1.17.2.jar
          rm -rf META-INF/maven

      - name: Copy resources and manifest
        run: |
          cp -r res build/classes/res
          mkdir -p build/classes/META-INF
          cp src/META-INF/MANIFEST.MF build/classes/META-INF/MANIFEST.MF

      - name: Build JAR
        run: |
          cd build/classes
          jar cfm ../../minecraft_server.jar META-INF/MANIFEST.MF .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Forge Server Starter ${{ steps.version.outputs.VERSION }}"
          body: |
            ## Forge Server Starter ${{ steps.version.outputs.VERSION }}

            ### Download
            Download `minecraft_server.jar` below and place it in your server directory.

            ### Configuration
            On first start, a `server_starter.conf` file will be created.
            You can configure timezone, java path, logging, and network check settings.

            Set `network_check=false` in `server_starter.conf` to skip the internet connection check on startup.
          files: minecraft_server.jar
          draft: false
          prerelease: false
