# Server Starter Configuration File
# Generated by Forge-Server-Starter

# Set your timezone here (e.g. Europe/Berlin, America/New_York, UTC)
timezone=UTC

# Set a custom Java path (leave as 'java' to use the system default)
# Example: java_path=/usr/lib/jvm/java-21-openjdk/bin/java
java_path=java

# Enable or disable debug logging (true/false)
debug=false

# Enable or disable logging to file (true/false)
log_to_file=true

# Disable the Internet-Connection-Check on Startup
# Useful if your network blocks the check (e.g. firewall or proxy)
# The Server-Starter will then skip the online check and try to start offline
# For Example network_check=false
network_check=true

# Enable or disable unique ID requests to the update API (true/false)
unique_id_request=true

# Unique ID (auto-generated, do not edit manually)
unique_id=

# Forge-Version-Update: Automatically update Forge/NeoForge to the latest version on every server start.
# Set to 'true' to enable automatic updates, 'false' to keep the current version.
# Warning: Updating may require a server restart and briefly take the server offline for re-installation.
auto_update_loader=false
